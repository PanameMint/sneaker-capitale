---
layout: default
---

<article>
  <div class="post-header">
    <div class="post-meta">
      <span class="tag">{{ page.categories | first }}</span> &nbsp; {{ page.date | date: "%-d %B %Y" }}
    </div>
    <h1>{{ page.title }}</h1>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
</article>

<a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
