---
layout: default
---

<div class="post-header">
  <div class="wrap">
    <div class="post-meta">{{ page.categories | first }}<span class="sep">/</span>{{ page.date | date: "%-d %B %Y" }}</div>
    <h1>{{ page.title }}</h1>
  </div>
</div>

<div class="wrap">
  <article class="post-content">
    {{ content }}
  </article>
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; All posts</a>
</div>
